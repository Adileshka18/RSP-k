name: savorlink-rsp-prod

services:
  db:
    image: postgres:16-alpine
    container_name: savorlink-rsp-db-prod
    environment:
      POSTGRES_USER: ${DB_USER:?Задайте DB_USER в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      POSTGRES_DB: ${DB_NAME:?Задайте DB_NAME в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savorlink-rsp-app-prod
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      BACKEND_RELOAD: "false"
    ports:
      - "8002:8002"
    command: python -m backend.main
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: savorlink-rsp-frontend-prod
    environment:
      VITE_API_BASE_URL: http://localhost:8002
      VITE_DEV_PROXY_TARGET: http://app:8002
    ports:
      - "5173:5173"
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    depends_on:
      - app

volumes:
  postgres_data:
