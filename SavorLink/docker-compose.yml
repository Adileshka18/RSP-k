# Отдельное имя проекта, чтобы том и контейнеры не пересекались с дипломной копией SavorLink
name: savorlink-rsp

services:
  db:
    image: postgres:16-alpine
    container_name: savorlink-rsp-db
    environment:
      POSTGRES_USER: ${DB_USER:?Задайте DB_USER в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      POSTGRES_DB: ${DB_NAME:?Задайте DB_NAME в .env}
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: savorlink-rsp-migrate
    volumes:
      - ./migrations:/migrations:ro
    # Флаги вынесены в entrypoint, чтобы команду можно было подменить:
    #   docker compose run --rm migrate down 1
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savorlink-rsp-app
    env_file: .env
    environment:
      # внутри сети Docker база доступна по имени сервиса
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8082:8002"
    volumes:
      - ./:/app
    command: python -m backend.main
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Не входит в задание, поэтому запускается только явно:
  #   docker compose --profile frontend up
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: savorlink-rsp-frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8082
      VITE_DEV_PROXY_TARGET: http://app:8002
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app

volumes:
  postgres_data:
  frontend_node_modules:
